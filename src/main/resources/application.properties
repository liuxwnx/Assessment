
#下面这些内容是为了让MyBatis映射
#指定Mybatis的Mapper文件
mybatis.mapper-locations=classpath:demos/web/mapper/*.xml
#指定Mybatis的实体目录
mybatis.type-aliases-package=com.example.assessment.mybatis.entity

# 应用服务 WEB 访问端口
server.port=8081

# 数据库连接URL
spring.datasource.url=jdbc:mysql://localhost:3306/assessment?useUnicode=true&characterEncoding=utf-8
# 数据库用户名和密码
spring.datasource.username=root
spring.datasource.password=root
# 数据库驱动类名
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

